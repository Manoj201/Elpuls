name: CI

# Type-checks the app and Cloud Functions on every PR (and is reused by the
# deploy workflow before anything ships).
on:
  pull_request:
  workflow_call:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: App — setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: App — install
        run: yarn install --frozen-lockfile

      - name: App — typecheck
        run: yarn typecheck

      # Functions run on the nodejs22 runtime; deploys also need Node 22
      # locally (see functions discovery / ESM note in project docs).
      - name: Functions — setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: functions/yarn.lock

      - name: Functions — install
        working-directory: functions
        run: yarn install --frozen-lockfile

      - name: Functions — typecheck
        working-directory: functions
        run: yarn typecheck

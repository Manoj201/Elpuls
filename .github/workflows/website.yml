name: Website

# Deploys the marketing site (website/) to Vercel production on every push to main.
# Vercel's own Git auto-deploys are turned off in website/vercel.json so this
# workflow is the only thing that deploys.
#
# Required repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# The Vercel CLI runs from the repo root: the project's Root Directory setting
# ("website", set in the Vercel dashboard) points it at the site, and
# website/vercel.json is read from there.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Builds on the runner (typecheck + vite build), so a broken build fails here
      # before anything is uploaded.
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"

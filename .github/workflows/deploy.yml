name: Deploy

# Deploys a release branch: Firebase (functions + Firestore rules/indexes)
# and an EAS iOS build. Manual only — normally started by the
# "Deploy to Production" workflow, which passes the release branch as ref.
# Refuses to run from anything but a release/* branch.
on:
  workflow_dispatch:
    inputs:
      ios_profile:
        description: EAS build profile (production needs an Apple Developer account)
        type: choice
        default: simulator
        options: [simulator, production]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only deploy from release/* branches
        if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          echo "::error::Deploy must run on a release/* branch (got ${{ github.ref }}). Use 'Create Release Candidate' first."
          exit 1

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  firebase:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: functions/yarn.lock

      - name: Install functions dependencies
        working-directory: functions
        run: yarn install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # The predeploy hook in firebase.json compiles functions with tsc.
      # --force: don't block on prompts (e.g. deleting a removed function).
      - name: Deploy functions + Firestore rules/indexes
        run: npx --yes firebase-tools@latest deploy --only functions,firestore --project elpuls --non-interactive --force

  ios:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Builds run on Expo's servers; --no-wait lets this job finish as soon
      # as the build is queued. Track it at expo.dev.
      - name: Start iOS build
        run: eas build --platform ios --profile ${{ inputs.ios_profile }} --non-interactive --no-wait
